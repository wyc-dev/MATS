<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATS — Daily PnL (Private)</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a24;
    --border: rgba(255,255,255,0.08);
    --text: #e4e4e7;
    --text-muted: #8b8b96;
    --green: #34d399;
    --red: #f87171;
    --purple: #a78bfa;
    --cyan: #22d3ee;
    --mono: 'SF Mono', 'Fira Code', monospace;
    --sans: -apple-system, 'Helvetica Neue', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  /* ── Rainbow ── */
  @keyframes rgb-shimmer {
    0% { background-position: 0% 0; }
    100% { background-position: 200% 0; }
  }
  .rainbow-text {
    background: linear-gradient(90deg, #ffb3cf, #ffd9b3, #fff0b3, #b3ffcc, #b3e0ff, #d4b3ff, #ffb3cf);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rgb-shimmer 4s linear infinite;
  }

  /* ── Header ── */
  .header { text-align: center; margin-bottom: 20px; }
  .header h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }
  .header .date { color: var(--text-muted); font-family: var(--mono); font-size: 0.8rem; margin-top: 4px; }
  .header .sub { color: var(--text-muted); font-size: 0.75rem; margin-top: 2px; }

  /* ── Controls ── */
  .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
  .switch-group { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
  .switch-btn {
    padding: 8px 20px; border: none; background: transparent; color: var(--text-muted);
    font-family: var(--mono); font-size: 0.8rem; font-weight: 700; border-radius: 8px; cursor: pointer;
    transition: all 0.2s;
  }
  .switch-btn.active-paper { background: var(--purple); color: #fff; }
  .switch-btn.active-real { background: var(--cyan); color: #000; }
  .switch-btn.active-period { background: var(--green); color: #000; }
  .switch-btn.active-period2 { background: var(--text); color: #000; }
  .btn {
    padding: 8px 18px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-family: var(--mono); font-size: 0.78rem; font-weight: 700;
    border-radius: 10px; cursor: pointer; transition: all 0.2s;
  }
  .btn:hover { border-color: var(--purple); color: var(--purple); }

  /* ── Stats cards ── */
  .stats { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 22px; text-align: center; min-width: 130px;
  }
  .stat .label { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .stat .value { font-family: var(--mono); font-size: 1.4rem; font-weight: 800; margin-top: 4px; }
  .stat .sub { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }

  /* ── Chart ── */
  .chart-wrap {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; width: 100%; max-width: 860px; position: relative;
  }
  canvas { width: 100%; height: 380px; display: block; border-radius: 8px; }

  /* ── Trade Summary + Records ── */
  .summary {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 20px; width: 100%; max-width: 860px; margin-top: 16px;
  }
  .summary h2 { font-size: 0.95rem; font-weight: 800; margin-bottom: 12px; color: var(--text); }
  .summary .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .summary .cell { background: var(--surface2); border-radius: 8px; padding: 8px 12px; }
  .summary .cell .k { font-size: 0.62rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .summary .cell .v { font-family: var(--mono); font-size: 1rem; font-weight: 700; margin-top: 2px; }

  .records { width: 100%; max-width: 860px; margin-top: 14px; }
  .records h2 { font-size: 0.95rem; font-weight: 800; margin-bottom: 10px; color: var(--text); }
  .trade-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .trade-card .row1 { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
  .trade-card .sym { font-family: var(--mono); font-weight: 800; font-size: 0.95rem; }
  .trade-card .side-buy { color: var(--green); }
  .trade-card .side-sell { color: var(--red); }
  .trade-card .pnl { font-family: var(--mono); font-weight: 800; font-size: 0.95rem; }
  .trade-card .meta { color: var(--text-muted); font-family: var(--mono); font-size: 0.72rem; margin-top: 4px; }
  .trade-card .thesis { color: var(--text-muted); font-size: 0.75rem; margin-top: 6px; line-height: 1.5; }
  .trade-card .thesis b { color: var(--text); font-weight: 600; }

  /* ── Footer ── */
  .footer { margin-top: 14px; color: var(--text-muted); font-size: 0.68rem; font-family: var(--mono); }
</style>
</head>
<body>

<div id="capture-root">
<div class="header">
  <h1><span class="rainbow-text">MATS</span> — Daily Cumulative PnL</h1>
  <div class="date" id="date-label">—</div>
  <div class="sub">AI-native multi-agent trading system · live cumulative PnL (local time GMT+8)</div>
</div>

<div class="controls">
  <div class="switch-group" id="mode-switch">
    <button class="switch-btn active-paper" data-mode="paper" id="btn-paper">PAPER</button>
    <button class="switch-btn" data-mode="real" id="btn-real">REAL</button>
  </div>
  <div class="switch-group" id="period-switch">
    <button class="switch-btn active-period" id="btn-yesterday">YESTERDAY</button>
    <button class="switch-btn active-period2" id="btn-today">TODAY</button>
  </div>
  <button class="btn" id="btn-refresh">⟳ Refresh</button>
  <button class="btn" id="btn-capture">📸 Capture</button>
</div>

<div class="stats">
  <div class="stat"><div class="label">Cumulative PnL</div><div class="value" id="stat-pnl">—</div></div>
  <div class="stat"><div class="label">Trades</div><div class="value" id="stat-trades">—</div></div>
  <div class="stat"><div class="label">Win Rate</div><div class="value" id="stat-winrate">—</div></div>
  <div class="stat"><div class="label">Avg Win / Loss</div><div class="value" id="stat-avg" style="font-size:0.9rem">—</div></div>
</div>

<div class="chart-wrap" id="chart-card">
  <canvas id="chart"></canvas>
</div>

<div class="summary" id="summary-section">
  <h2>📋 Today's Trade Summary</h2>
  <div class="grid" id="summary-grid"></div>
</div>

<div class="records">
  <h2>📜 Today's Trade Records</h2>
  <div id="records-list"></div>
</div>

<div class="footer">MATS PNL Dashboard · data via /api/pnl · private</div>
</div>

<script>
'use strict';

// ═══ State ═══
let data = null;
let mode = 'paper';      // paper | real
let period = 'today';    // today | yesterday(昨日數據一定完整——今日可能未完)

const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
  ? '' : '';

// ═══ Fetch ═══
async function load() {
  try {
    const res = await fetch(`${API_BASE}/api/pnl`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
    document.getElementById('date-label').textContent = data.date || '—';
    render();
  } catch (e) {
    document.getElementById('stat-pnl').textContent = '⚠ offline';
    document.getElementById('date-label').textContent = 'cannot reach backend /api/pnl';
  }
}

// ═══ Render ═══
function render() {
  if (!data) return;
  const p = data[period] || { date: '', paper: {}, real: {} };
  document.getElementById('date-label').textContent = `${p.date} (GMT+8)`;
  const d = p[mode] || { points: [], total: 0, trades: 0, wins: 0 };
  renderStats(d);
  renderChart(d);
  renderSummary(d);
  renderRecords(d);
}

// ═══ Today's Trade Summary(交易紀錄頂部總結)═══
function renderSummary(d) {
  const grid = document.getElementById('summary-grid');
  const pnls = (d.list || []).map(t => t.pnl || 0);
  const wins = pnls.filter(p => p > 0);
  const losses = pnls.filter(p => p < 0);
  const avgWin = wins.length ? wins.reduce((a, b) => a + b, 0) / wins.length : 0;
  const avgLoss = losses.length ? losses.reduce((a, b) => a + b, 0) / losses.length : 0;
  const maxWin = wins.length ? Math.max(...wins) : 0;
  const maxLoss = losses.length ? Math.min(...losses) : 0;
  const modeLabel = `${mode === 'paper' ? 'PAPER' : 'REAL'} · ${period === 'today' ? 'TODAY' : 'YESTERDAY'}`;
  const cells = [
    ['Mode', modeLabel, ''],
    ['Cumulative PnL', `${(d.total ?? 0) >= 0 ? '+' : ''}$${(d.total ?? 0).toFixed(2)}`, (d.total ?? 0) >= 0 ? 'var(--green)' : 'var(--red)'],
    ['Trades', String(d.trades ?? 0), ''],
    ['Win Rate', d.trades > 0 ? `${((d.wins ?? 0) / d.trades * 100).toFixed(1)}%` : '—', ''],
    ['Avg Win', wins.length ? `+$${avgWin.toFixed(2)}` : '—', 'var(--green)'],
    ['Avg Loss', losses.length ? `$${avgLoss.toFixed(2)}` : '—', 'var(--red)'],
    ['Best Trade', maxWin > 0 ? `+$${maxWin.toFixed(2)}` : '—', 'var(--green)'],
    ['Worst Trade', maxLoss < 0 ? `$${maxLoss.toFixed(2)}` : '—', 'var(--red)'],
  ];
  grid.innerHTML = cells.map(([k, v, c]) =>
    `<div class="cell"><div class="k">${k}</div><div class="v" style="color:${c || 'var(--text)'}">${v}</div></div>`
  ).join('');
}

// ═══ Today's Trade Records(完整交易紀錄)═══
function renderRecords(d) {
  const list = document.getElementById('records-list');
  const records = d.list || [];
  if (records.length === 0) {
    list.innerHTML = '<div class="trade-card"><div class="meta">No trades closed today yet</div></div>';
    return;
  }
  const fmtT = (ts) => {
    if (!ts) return '—';
    const dt = new Date(ts);
    return `${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`;
  };
  const fmtFull = (ts) => {
    if (!ts) return '—';
    return new Date(ts).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
  };
  const esc = (v) => String(v ?? '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const cards = records.map((t, i) => {
    const side = t.side === 'sell' ? 'SHORT' : 'LONG';
    const sideCls = t.side === 'sell' ? 'side-sell' : 'side-buy';
    const pnl = Number(t.pnl ?? 0);
    const pnlCls = pnl >= 0 ? 'var(--green)' : 'var(--red)';
    const holdMin = t.openedAt && t.closedAt ? Math.max(0, Math.round((Number(t.closedAt) - Number(t.openedAt)) / 60000)) : null;
    return `<div class="trade-card">
      <div class="row1">
        <div><span class="sym">${esc(t.symbol)}</span> <span class="${sideCls}" style="font-family:var(--mono);font-weight:700">${side}</span></div>
        <div class="pnl" style="color:${pnlCls}">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)} (${(Number(t.pnlPct ?? 0) * 100).toFixed(2)}%)</div>
      </div>
      <div class="meta">Entry $${Number(t.entryPrice ?? 0).toFixed(2)} → Exit $${Number(t.exitPrice ?? 0).toFixed(2)}${t.leverage ? ' · ' + t.leverage + 'x' : ''}${holdMin !== null ? ' · hold ' + holdMin + 'm' : ''} · ${fmtFull(t.openedAt)} → ${fmtFull(t.closedAt)}</div>
      ${t.entryThesis ? `<div class="thesis"><b>Entry Thesis:</b> ${esc(t.entryThesis)}</div>` : ''}
      ${t.exitThesis ? `<div class="thesis"><b>Exit Thesis:</b> ${esc(t.exitThesis)}</div>` : ''}
      ${t.closeReason ? `<div class="thesis"><b>Close:</b> ${esc(t.closeReason)}</div>` : ''}
    </div>`;
  }).join('');
  list.innerHTML = cards;
}

function renderStats(d) {
  const total = d.total ?? 0;
  const trades = d.trades ?? 0;
  const wins = d.wins ?? 0;
  const el = (id, txt, cls) => {
    const e = document.getElementById(id);
    e.textContent = txt;
    e.style.color = cls;
  };
  el('stat-pnl', `${total >= 0 ? '+' : ''}$${total.toFixed(2)}`, total >= 0 ? 'var(--green)' : 'var(--red)');
  el('stat-trades', String(trades));
  const wr = trades > 0 ? (wins / trades) * 100 : 0;
  el('stat-winrate', trades > 0 ? `${wr.toFixed(1)}%` : '—');
  el('stat-avg', '—');
}

function renderChart(d) {
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth;
  const H = canvas.clientHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.fillStyle = '#12121a';
  ctx.fillRect(0, 0, W, H);

  const pts = (d.points || []).slice();
  if (pts.length === 0) {
    ctx.fillStyle = '#8b8b96';
    ctx.font = '14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('No trades closed today yet', W / 2, H / 2);
    return;
  }

  // v2.0.868-fix:起點由零開始(開市累計 = 0)——line 由 0 起
  // 用所選 period 嘅 date 做起點(今日/昨日)
  const periodDate = (data[period] || {}).date;
  const dayStart = new Date((periodDate || data.date || '') + 'T00:00:00').getTime();
  const anchor = Number.isFinite(dayStart) ? dayStart : (pts[0].t - 24 * 3600 * 1000);
  pts.unshift({ t: anchor, cum: 0 });

  // range(包含 0——起點)
  const tMin = pts[0].t, tMax = pts[pts.length - 1].t;
  let vMin = Math.min(...pts.map(p => p.cum), 0);
  let vMax = Math.max(...pts.map(p => p.cum), 0);
  const pad = (vMax - vMin) * 0.15 || 1;
  vMin -= pad; vMax += pad;

  const padL = 10, padR = 10, padT = 16, padB = 24;
  const X = (t) => padL + ((t - tMin) / Math.max(1, tMax - tMin)) * (W - padL - padR);
  const Y = (v) => padT + (1 - (v - vMin) / (vMax - vMin)) * (H - padT - padB);

  // zero line
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(padL, Y(0)); ctx.lineTo(W - padR, Y(0));
  ctx.stroke();
  ctx.setLineDash([]);

  // grid + y labels
  ctx.fillStyle = '#8b8b96';
  ctx.font = '10px monospace';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const v = vMin + ((vMax - vMin) * i) / 4;
    const y = Y(v);
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    ctx.fillText(`${v >= 0 ? '+' : ''}${v.toFixed(2)}`, W - padR - 4, y - 3);
  }

  // 日期標注(圖表頂部中央——主神要求)
  ctx.fillStyle = '#e4e4e7';
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`📅 ${data.date} (GMT+8)`, W / 2, 12);

  // peak / trough 標注(最高/最低累計點)
  const peak = pts.reduce((a, b) => (b.cum > a.cum ? b : a));
  const trough = pts.reduce((a, b) => (b.cum < a.cum ? b : a));
  ctx.font = '10px monospace';
  if (peak.cum > 0) {
    ctx.fillStyle = '#34d399';
    ctx.textAlign = 'left';
    ctx.fillText(`▲ peak +$${peak.cum.toFixed(2)}`, X(peak.t) + 6, Y(peak.cum) - 6);
  }
  if (trough.cum < 0) {
    ctx.fillStyle = '#f87171';
    ctx.textAlign = 'left';
    ctx.fillText(`▼ trough $${trough.cum.toFixed(2)}`, X(trough.t) + 6, Y(trough.cum) + 12);
  }

  // x time labels (first / mid / last)
  ctx.textAlign = 'center';
  const fmt = (t) => {
    const dt = new Date(t);
    return `${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`;
  };
  ctx.fillText(fmt(tMin), padL, H - 6);
  ctx.fillText(fmt(pts[Math.floor(pts.length / 2)].t), W / 2, H - 6);
  ctx.fillText(fmt(tMax), W - padR, H - 6);

  // cumulative line (green if final >= 0, red if < 0)
  const color = (d.total ?? 0) >= 0 ? '#34d399' : '#f87171';
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  pts.forEach((p, i) => {
    const x = X(p.t), y = Y(p.cum);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // glow
  ctx.strokeStyle = color + '44';
  ctx.lineWidth = 8;
  ctx.stroke();

  // area fill
  const grad = ctx.createLinearGradient(0, padT, 0, H - padB);
  grad.addColorStop(0, color + '33');
  grad.addColorStop(1, color + '00');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(X(tMin), Y(vMin));
  pts.forEach(p => ctx.lineTo(X(p.t), Y(p.cum)));
  ctx.lineTo(X(tMax), Y(vMin));
  ctx.closePath();
  ctx.fill();

  // 每 trade 點 marker(細點——每個 close 位置)
  ctx.fillStyle = color;
  for (let i = 1; i < pts.length; i++) {
    ctx.beginPath();
    ctx.arc(X(pts[i].t), Y(pts[i].cum), 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // last point marker(大——目前值)
  const last = pts[pts.length - 1];
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(X(last.t), Y(last.cum), 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#0a0a0f';
  ctx.lineWidth = 2;
  ctx.stroke();
  // 目前值標注
  ctx.fillStyle = '#e4e4e7';
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`now ${last.cum >= 0 ? '+' : ''}$${last.cum.toFixed(2)}`, X(last.t) + 10, Y(last.cum) - 8);
}

// ═══ Mode switch ═══
document.getElementById('btn-paper').addEventListener('click', () => setMode('paper'));
document.getElementById('btn-real').addEventListener('click', () => setMode('real'));
document.getElementById('btn-yesterday').addEventListener('click', () => setPeriod('yesterday'));
document.getElementById('btn-today').addEventListener('click', () => setPeriod('today'));

function setPeriod(p) {
  period = p;
  document.getElementById('btn-yesterday').className = `switch-btn${p === 'yesterday' ? ' active-period' : ''}`;
  document.getElementById('btn-today').className = `switch-btn${p === 'today' ? ' active-period2' : ''}`;
  render();
}

function setMode(m) {
  mode = m;
  document.getElementById('btn-paper').className = `switch-btn${m === 'paper' ? ' active-paper' : ''}`;
  document.getElementById('btn-real').className = `switch-btn${m === 'real' ? ' active-real' : ''}`;
  render();
}

// ═══ Refresh ═══
document.getElementById('btn-refresh').addEventListener('click', load);

// ═══ Capture (html2canvas CDN + canvas fallback) ═══
document.getElementById('btn-capture').addEventListener('click', async () => {
  const root = document.getElementById('capture-root');
  try {
    if (window.html2canvas) {
      // 截成張 dashboard(header + stats + chart)——scale 2 高清
      const canvas = await html2canvas(root, { backgroundColor: '#0a0a0f', scale: 2, logging: false });
      download(canvas.toDataURL('image/png'));
      return;
    }
    // fallback:截 chart card(含 stats 上方區域)
    const card = document.getElementById('chart-card');
    const c = document.getElementById('chart');
    download(c.toDataURL('image/png'));
  } catch {
    const c = document.getElementById('chart');
    download(c.toDataURL('image/png'));
  }
});

function download(dataUrl) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = `MATS-PnL-${mode}-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.png`;
  a.click();
}

// load html2canvas lazily on capture (offline fallback = canvas only)
const script = document.createElement('script');
script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
script.onerror = () => { /* offline — fallback to canvas capture */ };
document.head.appendChild(script);

// ═══ Init ═══
load();
setInterval(load, 60_000); // auto refresh every minute
</script>
</body>
</html>
